kind = "web"
previewPath = "/"
title = "Knowledge Base"
version = "1.0.0"
id = "artifacts/knowledge-base"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19350

[services.development]
run = "pnpm --filter @workspace/knowledge-base run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/knowledge-base", "run", "build" ]
publicDir = "artifacts/knowledge-base/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19350"
BASE_PATH = "/"
