name: Build Android APK

# Triggers: every push to main/master, every PR into main/master,
# and on-demand via the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node / pnpm ────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ── 3. Dependencies ───────────────────────────────────────────────────
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── 4. Java (required by Gradle / Android toolchain) ──────────────────
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Android SDK ────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ── 6. Expo prebuild → generate android/ native project ───────────────
      - name: Cache Expo Metro bundler
        uses: actions/cache@v4
        with:
          path: artifacts/memex-mobile/.expo
          key: expo-metro-${{ runner.os }}-${{ hashFiles('artifacts/memex-mobile/package.json') }}

      - name: Expo prebuild (Android)
        working-directory: artifacts/memex-mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      # ── 7. Gradle cache + build ────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/memex-mobile/android/**/*.gradle*', 'artifacts/memex-mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        working-directory: artifacts/memex-mobile/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: artifacts/memex-mobile/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false'

      # ── 8. Upload artifact ─────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: memex-android-debug-${{ github.run_number }}
          path: artifacts/memex-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
