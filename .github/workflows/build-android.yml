name: Build Android APK

permissions:
  contents: read

# Triggers: every push to main/master, every PR into main/master,
# and on-demand via the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build standalone Android testing APK
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Node / pnpm ────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      # ── 3. Dependencies ───────────────────────────────────────────────────
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production Expo config
        working-directory: artifacts/memex-mobile
        env:
          NODE_ENV: production
        # Keep this check self-contained so it cannot fail on a missing test file.
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { spawnSync } = require('node:child_process');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');

          const plugin = require('./plugins/withOfflineAndroid.cjs');
          const config = plugin({ name: 'Native config regression', slug: 'native-config-regression' });
          assert.equal(typeof config.mods.android.manifest, 'function');
          assert.equal(typeof config.mods.android.dangerous, 'function');

          const output = fs.mkdtempSync(path.join(os.tmpdir(), 'memex-native-config-'));
          try {
            const constantsRoot = path.dirname(require.resolve('expo-constants/package.json'));
            const result = spawnSync(process.execPath, [
              path.join(constantsRoot, 'scripts/getAppConfig.js'), process.cwd(), output,
            ], {
              cwd: process.cwd(),
              env: { ...process.env, NODE_ENV: 'production' },
              encoding: 'utf8',
              timeout: 60_000,
            });
            assert.ifError(result.error);
            assert.equal(result.status, 0, result.stderr || 'Native config generation failed');
            const actual = JSON.parse(fs.readFileSync(path.join(output, 'app.config'), 'utf8'));
            const expected = require('./app.json').expo;
            assert.equal(actual.name, expected.name);
            assert.equal(actual.android.package, expected.android.package);
            console.log('Production Expo config and offline Android plugin validated.');
          } finally {
            fs.rmSync(output, { recursive: true, force: true });
          }
          NODE

      # ── 4. Java (required by Gradle / Android toolchain) ──────────────────
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Android SDK ────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Retain the command-line tools already verified with Java 17.
          cmdline-tools-version: '12266719'
          # Keep packages explicit: never reinstall the obsolete "tools" package.
          packages: platform-tools

      - name: Install Android platform & build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # ── 6. Expo prebuild → generate android/ native project ───────────────
      - name: Cache Expo Metro bundler
        uses: actions/cache@v5
        with:
          path: artifacts/memex-mobile/.expo
          key: expo-metro-${{ runner.os }}-${{ hashFiles('artifacts/memex-mobile/package.json') }}

      - name: Expo prebuild (Android)
        working-directory: artifacts/memex-mobile
        env:
          NODE_ENV: production
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Install dependencies after prebuild
        run: pnpm install --frozen-lockfile

      # ── 7. Gradle cache + build ────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/memex-mobile/android/**/*.gradle*', 'artifacts/memex-mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        working-directory: artifacts/memex-mobile/android
        run: chmod +x gradlew

      # Expo's release variant embeds the JS/Hermes bundle and font/assets and
      # disables Metro/dev support. The generated template signs release with
      # its PUBLIC debug key: this is a standalone TEST build, not store signing.
      - name: Build bundled standalone testing APK
        working-directory: artifacts/memex-mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          NODE_ENV: production
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false'

      - name: Verify embedded bundle and fonts
        run: |
          APK=artifacts/memex-mobile/android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E 'assets/index.android.bundle'
          unzip -l "$APK" | grep -Ei '\.(ttf|otf)'

      - name: Offline download regression tests
        run: |
          node --test lib/image-size-safe/compatibility.test.cjs
          pnpm --filter @workspace/memex-mobile run typecheck
          pnpm --filter @workspace/api-server exec tsx --test ../memex-mobile/test/*.test.ts

      # ── 8. Upload artifact ─────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: memex-android-standalone-test-${{ github.run_number }}
          path: artifacts/memex-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Native standalone and offline cold-start test
        id: offline_smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            node .github/scripts/android-offline-fixture.cjs > /tmp/memex-fixture.log 2>&1 &
            node .github/scripts/android-offline-smoke.mjs artifacts/memex-mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android test evidence
        if: ${{ always() && steps.offline_smoke.outcome != 'skipped' && steps.offline_smoke.outcome != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: memex-android-offline-evidence-${{ github.run_number }}
          path: /tmp/memex-android-evidence
          if-no-files-found: warn
