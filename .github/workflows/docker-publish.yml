name: Build & Publish Docker Image

on:
  push:
    branches: ["main"]        # keeps :latest and :builder in sync with every merge
    tags: ["v*.*.*"]          # produces semver tags (e.g. :1.2.3, :1.2) on releases
  workflow_dispatch:           # allow manual re-runs from the GitHub UI

env:
  REGISTRY: ghcr.io
  # github.repository is "klarge/Lexikon" — GHCR lowercases it automatically,
  # but we lowercase here too so the docker-compose.yml reference is predictable.
  IMAGE: ghcr.io/klarge/lexikon

jobs:
  build-and-push:
    name: Build multi-arch image and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (required for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Runtime image tags ────────────────────────────────────────────────
      # On main push:   :latest
      # On v1.2.3 tag:  :1.2.3  :1.2  :1  :latest
      - name: Extract metadata for runtime image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build & push: runtime (the image used by the `app` service) ───────
      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & push: builder (the image used by the `migrate` service) ───
      # Always tagged :builder — the migrate service pulls this to run
      # `drizzle-kit push` without needing the source tree on the Docker host.
      - name: Build and push builder image (for migrate service)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
