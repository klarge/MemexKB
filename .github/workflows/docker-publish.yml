name: Build & Publish Docker Image

on:
  push:
    branches: ["main"]       # keeps :latest and :builder in sync with every merge
    tags: ["v*.*.*"]         # produces semver tags (e.g. :1.2.3, :1.2) on releases
  workflow_dispatch:          # allow manual re-runs from the GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/klarge/lexikon

jobs:
  build-and-push:
    name: Build and push linux/amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Runtime image tags ────────────────────────────────────────────────
      # On main push:   :latest
      # On v1.2.3 tag:  :1.2.3  :1.2  :1  :latest
      - name: Extract metadata for runtime image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

