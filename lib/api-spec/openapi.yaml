openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Knowledge Base API — used by the web app and AI agents
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session management
  - name: articles
    description: Article CRUD, search, and backlinks
  - name: users
    description: User management (admin only)
  - name: groups
    description: Group and membership management (admin only)
  - name: admin
    description: Admin-only bulk operations
  - name: tags
    description: Tag management
  - name: projects
    description: Project workspaces, boards, and documents
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/recovery/reset:
    post:
      operationId: resetRecoveredPassword
      tags: [auth]
      summary: Set a new password with a one-time recovery link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired recovery link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/tokens:
    get:
      operationId: listApiTokens
      tags: [auth]
      summary: List API tokens for the current user
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of API tokens (token hashes are never returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createApiToken
      tags: [auth]
      summary: Create a new API token
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenInput"
      responses:
        "201":
          description: Token created — the raw token value is returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/tokens/{id}:
    delete:
      operationId: revokeApiToken
      tags: [auth]
      summary: Revoke an API token
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid token ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Articles ───────────────────────────────────────────────────────────────
  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List all articles (titles only for access-restricted ones)
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Filter articles by title/content substring
        - name: sort
          in: query
          schema:
            type: string
            enum: [title, updated_at, created_at]
            default: title
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: tagId
          in: query
          schema:
            type: integer
          description: Filter articles by tag ID
      responses:
        "200":
          description: Article list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"
    post:
      operationId: createArticle
      tags: [articles]
      summary: Create a new article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/maintenance:
    get:
      operationId: listArticlesMaintenance
      tags: [articles]
      summary: List articles sorted by oldest last-modified (maintenance view)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Articles sorted by oldest updated_at first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"

  /projects/{projectId}/documents:
    get:
      operationId: listProjectDocuments
      tags: [projects]
      summary: List documents belonging to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocumentListResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProjectDocument
      tags: [projects]
      summary: Create a document in a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocument"

  /projects/{projectId}/documents/{slug}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProjectDocument
      tags: [projects]
      summary: Read a project document
      responses:
        "200":
          description: Project document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocument"
    patch:
      operationId: updateProjectDocument
      tags: [projects]
      summary: Update a project document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDocumentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocument"
    delete:
      operationId: deleteProjectDocument
      tags: [projects]
      summary: Delete a project document
      responses:
        "204":
          description: Deleted

  /articles/stats:
    get:
      operationId: getArticleStats
      tags: [articles]
      summary: Get aggregate stats for the knowledge base dashboard
      responses:
        "200":
          description: Stats object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleStats"

  /logs/{userId}/{logSlug}:
    get:
      operationId: getLogEntry
      tags: [articles]
      summary: Get a private log entry by its owner and stable log URL segment
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: logSlug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "200":
          description: The requested private log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Log entry not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{slug}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get a single article by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Article object. When the caller lacks group membership for a restricted article,
            the response still returns HTTP 200 with `canAccess: false` and an empty `content`
            string — the title and metadata are always visible to authenticated users.
            Unauthenticated callers likewise receive the title with `canAccess: false` and
            empty content for any group-restricted article.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateArticle
      tags: [articles]
      summary: Update an article
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdate"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteArticle
      tags: [articles]
      summary: Delete an article
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{slug}/slug:
    patch:
      operationId: updateArticleSlug
      tags: [articles]
      summary: Change an article URL and update inbound wikilinks
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleSlugUpdate"
      responses:
        "200":
          description: Article URL updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleSlugUpdateResult"
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: URL already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{slug}/lock:
    get:
      operationId: getArticleLock
      tags: [articles]
      summary: Get the current edit lock status for an article
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lock status (null lockedBy means no lock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditLockStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: acquireArticleLock
      tags: [articles]
      summary: Acquire or refresh an edit lock for an article
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lock acquired or refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditLockStatus"
        "409":
          description: Article is locked by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditLockStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: releaseArticleLock
      tags: [articles]
      summary: Release an edit lock (own lock only; admins can release any)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lock released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{slug}/backlinks:
    get:
      operationId: getArticleBacklinks
      tags: [articles]
      summary: Get all articles that link to this article
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of articles linking to this one
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{slug}/export/md:
    get:
      operationId: exportArticleMarkdown
      tags: [articles]
      summary: Export article as Markdown file
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Markdown file
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{slug}/export/pdf:
    get:
      operationId: exportArticlePdf
      tags: [articles]
      summary: Export article as PDF
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{slug}/groups:
    put:
      operationId: setArticleGroups
      tags: [articles]
      summary: Set the groups that can access this article
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleGroupsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"

  /articles/images:
    post:
      operationId: uploadArticleImage
      tags: [articles]
      summary: Upload an image for use in an article
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUploadInput"
      responses:
        "201":
          description: Uploaded image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResponse"

  # ─── Tags ───────────────────────────────────────────────────────────────────
  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: List all tags (any authenticated user)
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      operationId: createTag
      tags: [tags]
      summary: Create a new tag (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "409":
          description: Tag name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tags/{id}:
    patch:
      operationId: updateTag
      tags: [tags]
      summary: Update a tag (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdate"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: Delete a tag (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Users ──────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/{id}/groups:
    get:
      operationId: getUserGroups
      tags: [users]
      summary: Get groups a user belongs to
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"

  # ─── Groups ─────────────────────────────────────────────────────────────────
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all groups
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /groups/{id}/members:
    post:
      operationId: addGroupMember
      tags: [groups]
      summary: Add a user to a group (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberInput"
      responses:
        "200":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /groups/{id}/members/{userId}:
    delete:
      operationId: removeGroupMember
      tags: [groups]
      summary: Remove a user from a group (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Admin ──────────────────────────────────────────────────────────────────
  /admin/export:
    get:
      operationId: adminExportAll
      tags: [admin]
      summary: Export all articles as a zip file (admin only)
      responses:
        "200":
          description: Zip file containing all articles as markdown + metadata JSON
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /admin/import:
    post:
      operationId: adminImportAll
      tags: [admin]
      summary: Import articles from a zip file (admin only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImportResponse"

  /admin/restore/preview:
    post:
      operationId: previewAdminRestore
      tags: [admin]
      summary: Validate and preview a Logs, Tasks, or Projects JSON backup (admin only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminRestorePreviewInput"
      responses:
        "200":
          description: Backup preview and available local account mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRestorePreview"
        "400":
          description: Invalid backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/restore:
    post:
      operationId: restoreAdminBackup
      tags: [admin]
      summary: Restore a validated Logs, Tasks, or Projects JSON backup (admin only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminRestoreInput"
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRestoreResult"
        "400":
          description: Invalid backup or account mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/full-backup/export:
    post:
      operationId: exportFullEnvironmentBackup
      tags: [admin]
      summary: Download an encrypted full environment backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FullBackupPassphraseInput"
      responses:
        "200":
          description: Encrypted full environment backup
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /admin/full-backup/preview:
    post:
      operationId: previewFullEnvironmentRestore
      tags: [admin]
      summary: Decrypt and preview a full environment backup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FullBackupRestoreInput"
      responses:
        "200":
          description: Full environment restore preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullBackupPreview"
        "400":
          description: Invalid archive or passphrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/full-backup/restore:
    post:
      operationId: restoreFullEnvironmentBackup
      tags: [admin]
      summary: Replace an environment with an encrypted full backup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FullBackupRestoreInput"
      responses:
        "200":
          description: Full environment restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullBackupRestoreResult"
        "400":
          description: Invalid archive, passphrase, or confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Destination must be explicitly replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    PasswordRecoveryInput:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }

    FullBackupPassphraseInput:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 12 }

    FullBackupRestoreInput:
      type: object
      required: [file, passphrase]
      properties:
        file:
          type: string
          format: binary
        passphrase:
          type: string
          minLength: 12
        mode:
          type: string
          enum: [empty, replace]
        confirmation:
          type: string

    FullBackupSection:
      type: object
      required: [count, checksum]
      properties:
        count: { type: integer }
        checksum: { type: string }

    FullBackupPreview:
      type: object
      required: [exportedAt, sections, excluded, destinationHasData, warning]
      properties:
        exportedAt: { type: string, format: date-time }
        sections:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FullBackupSection"
        excluded:
          type: array
          items: { type: string }
        destinationHasData: { type: boolean }
        warning: { type: string }

    FullBackupRecoveryLink:
      type: object
      required: [userId, recoveryUrl]
      properties:
        userId: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        recoveryUrl: { type: string }

    FullBackupRestoreResult:
      type: object
      required: [restored, recoveryLinks, warning]
      properties:
        restored:
          type: object
          additionalProperties: { type: integer }
        recoveryLinks:
          type: array
          items:
            $ref: "#/components/schemas/FullBackupRecoveryLink"
        warning: { type: string }

    # ─── Admin restore ──────────────────────────────────────────────────────────
    AdminRestorePreviewInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    AdminRestoreInput:
      type: object
      required: [file, ownerMappings]
      properties:
        file:
          type: string
          format: binary
        ownerMappings:
          type: string
          description: JSON object mapping each exported owner key to a local user ID.

    AdminRestoreOwner:
      type: object
      required: [key, label, suggestedUserId]
      properties:
        key:
          type: string
        label:
          type: string
        suggestedUserId:
          type: ["integer", "null"]

    AdminRestoreUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email

    AdminRestorePreview:
      type: object
      required: [kind, total, owners, users, warnings]
      properties:
        kind:
          type: string
          enum: [logs, tasks, projects]
        total:
          type: integer
        owners:
          type: array
          items:
            $ref: "#/components/schemas/AdminRestoreOwner"
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminRestoreUser"
        warnings:
          type: array
          items:
            type: string

    AdminRestoreCounts:
      type: object
      required: [logs, taskLists, tasks, projects, boards, columns, cards]
      properties:
        logs: { type: integer }
        taskLists: { type: integer }
        tasks: { type: integer }
        projects: { type: integer }
        boards: { type: integer }
        columns: { type: integer }
        cards: { type: integer }

    AdminRestoreResult:
      type: object
      required: [kind, imported, skipped, warnings]
      properties:
        kind:
          type: string
          enum: [logs, tasks, projects]
        imported:
          $ref: "#/components/schemas/AdminRestoreCounts"
        skipped:
          type: integer
        warnings:
          type: array
          items:
            type: string

    # ─── Tags ──────────────────────────────────────────────────────────────────
    Tag:
      type: object
      required: [id, name, color, createdAt, articleCount]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
        articleCount:
          type: integer

    TagInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string

    TagUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string

    # ─── Shared ────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    # ─── Auth ──────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    AuthUser:
      type: object
      required: [id, email, role, name]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, user]

    # ─── Articles ──────────────────────────────────────────────────────────────
    ArticleSummary:
      type: object
      required: [id, slug, title, updatedAt, createdAt]
      properties:
        id:
          type: integer
        slug:
          type: string
        logSlug:
          type: ["string", "null"]
          description: Stable owner-scoped URL segment for personal log entries
        logOwnerId:
          type: ["integer", "null"]
          description: Owner ID for personal log entries
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedByName:
          type: ["string", "null"]
        isRestricted:
          type: boolean
          description: True when the article has group restrictions
        canAccess:
          type: boolean
          description: True when the current user can view the content
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    Article:
      type: object
      required: [id, slug, title, content, updatedAt, createdAt, groups, isRestricted, canAccess]
      properties:
        id:
          type: integer
        projectId:
          type: ["integer", "null"]
          description: Owning project when this article is a project document
        slug:
          type: string
        title:
          type: string
        content:
          type: string
          description: HTML content of the article
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedByName:
          type: ["string", "null"]
        isRestricted:
          type: boolean
        canAccess:
          type: boolean
        canEdit:
          type: boolean
          description: Whether the current user can edit a project document
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
        backlinks:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSummary"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    ArticleListResponse:
      type: object
      required: [articles, total]
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSummary"
        total:
          type: integer

    ProjectDocumentInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          description: HTML content
        tagIds:
          type: array
          items:
            type: integer

    ProjectDocument:
      allOf:
        - $ref: "#/components/schemas/Article"
        - type: object
          required: [projectId, canEdit]
          properties:
            projectId:
              type: integer
            canEdit:
              type: boolean

    ProjectDocumentListResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ArticleSummary"
              - type: object
                required: [projectId, canEdit]
                properties:
                  projectId:
                    type: integer
                  canEdit:
                    type: boolean

    ArticleInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          description: HTML content
        groupIds:
          type: array
          items:
            type: integer
        tagIds:
          type: array
          items:
            type: integer
        isLogEntry:
          type: boolean
          description: Create a personal log entry instead of a shared article

    ArticleUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        groupIds:
          type: array
          items:
            type: integer
        tagIds:
          type: array
          items:
            type: integer

    ArticleSlugUpdate:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+){0,99}$"
          maxLength: 100

    ArticleSlugUpdateResult:
      type: object
      required: [slug, rewrittenArticles]
      properties:
        slug:
          type: string
        rewrittenArticles:
          type: integer

    ArticleGroupsInput:
      type: object
      required: [groupIds]
      properties:
        groupIds:
          type: array
          items:
            type: integer

    ArticleStats:
      type: object
      required: [totalArticles, restrictedArticles, totalGroups, totalUsers, recentlyUpdated]
      properties:
        totalArticles:
          type: integer
        restrictedArticles:
          type: integer
        totalGroups:
          type: integer
        totalUsers:
          type: integer
        recentlyUpdated:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSummary"
        oldestUpdated:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSummary"

    EditLockStatus:
      type: object
      required: [articleId, lockedBy]
      properties:
        articleId:
          type: integer
        lockedBy:
          oneOf:
            - type: "null"
            - type: object
              required: [userId, userName, lockedAt]
              properties:
                userId:
                  type: integer
                userName:
                  type: string
                lockedAt:
                  type: string
                  format: date-time

    ImageUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Image file to upload (field name "file" in multipart/form-data)

    ImageUploadResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    # ─── Users ─────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, user]
        createdAt:
          type: string
          format: date-time
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"

    UserInput:
      type: object
      required: [email, name, password, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, editor, user]

    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [admin, editor, user]
        password:
          type: string
          minLength: 8

    # ─── Groups ────────────────────────────────────────────────────────────────
    GroupSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]

    Group:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        memberCount:
          type: integer

    GroupDetail:
      type: object
      required: [id, name, createdAt, members]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"

    GroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    GroupMemberInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer

    # ─── Admin ─────────────────────────────────────────────────────────────────
    AdminImportInput:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: A ZIP archive or single .md file (field name "file" in multipart/form-data)
        files:
          type: array
          items:
            type: string
            format: binary
          description: Multiple .md files for folder import (field name "files" in multipart/form-data)
        overwrite:
          type: boolean
          default: false
          description: When true, overwrite existing articles with the same slug

    AdminImportResponse:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    # ─── API Tokens ──────────────────────────────────────────────────────────────
    ApiToken:
      type: object
      required: [id, name, accessMode, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        accessMode:
          type: string
          enum: [full, read_only]
          default: full
          description: Whether this token can make changes or only read data
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ApiTokenInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable label for this token
        accessMode:
          type: string
          enum: [full, read_only]
          default: full
          description: Choose full access or a token restricted to read requests
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry date-time (ISO 8601)

    ApiTokenCreated:
      type: object
      required: [id, name, token, message, accessMode, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        accessMode:
          type: string
          enum: [full, read_only]
          description: Access mode selected for this token
        token:
          type: string
          description: The raw token value — save it now, it will not be shown again
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie set after login
    bearerAuth:
      type: http
      scheme: bearer
      description: "API token — pass as Authorization: Bearer <token>. Read-only keys can use GET requests only; full-access keys retain the owner's normal permissions."
