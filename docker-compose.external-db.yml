# Standalone alternative to docker-compose.yml: only the app (and optional MCP).
# Run with: docker compose -f docker-compose.external-db.yml up -d
# Set DATABASE_URL and SESSION_SECRET in an untracked .env file.
services:
  app:
    image: ghcr.io/klarge/memexkb:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env for the external PostgreSQL database}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      STATIC_DIR: /app/public
      MIGRATIONS_DIR: /app/migrations
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

  mcp:
    image: ghcr.io/klarge/memexkb:latest
    profiles: ["mcp"]
    stdin_open: true
    tty: false
    command: ["node", "/app/mcp/dist/index.js"]
    environment:
      MEMEX_URL: http://app:3000
    depends_on:
      app:
        condition: service_started