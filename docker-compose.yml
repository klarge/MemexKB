services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexikon
      POSTGRES_USER: lexikon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexikon -d lexikon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application ──────────────────────────────────────────────────────────────
  # Schema migrations run automatically on every startup via drizzle-orm/migrator
  # before the HTTP server binds — no separate migrate container needed.
  app:
    image: ghcr.io/klarge/lexikon:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgres://lexikon:${POSTGRES_PASSWORD:-changeme}@db:5432/lexikon}
      SESSION_SECRET: ${SESSION_SECRET}
      STATIC_DIR: /app/public
      MIGRATIONS_DIR: /app/migrations
      # Optional — comma-separated list of allowed CORS origins
      # CORS_ORIGIN: https://yourdomain.com
      # Optional — seed an initial admin account on first boot
      # RUN_SEED: "true"
      # SEED_ADMIN_EMAIL: admin@example.com
      # SEED_ADMIN_PASSWORD: changeme123
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
