services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexikon
      POSTGRES_USER: lexikon
      POSTGRES_PASSWORD: changeme        # ← change this password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexikon -d lexikon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application ──────────────────────────────────────────────────────────────
  # Schema migrations run automatically on startup — no separate migrate container.
  app:
    image: ghcr.io/klarge/lexikon:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Keep the password here in sync with POSTGRES_PASSWORD above.
      DATABASE_URL: postgres://lexikon:changeme@db:5432/lexikon
      # Generate a strong random value: openssl rand -hex 32
      SESSION_SECRET: replace-with-a-strong-secret
      STATIC_DIR: /app/public
      MIGRATIONS_DIR: /app/migrations
      # Set to "true" when the app is served over HTTPS (e.g. behind a
      # reverse proxy with TLS). Leave unset or "false" for plain HTTP.
      # The app automatically trusts one proxy hop, so Secure cookies work
      # correctly when TLS is terminated at the reverse proxy.
      COOKIE_SECURE: "true"
      # Optional — uncomment to seed an initial admin account on first boot:
      # RUN_SEED: "true"
      # SEED_ADMIN_EMAIL: admin@example.com
      # SEED_ADMIN_PASSWORD: changeme123
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
