services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: memexkb
      POSTGRES_USER: memexkb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme} # Replace for real deployments.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memexkb -d memexkb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application ──────────────────────────────────────────────────────────────
  # Schema migrations run automatically on startup — no separate migrate container.
  app:
    image: ghcr.io/klarge/memexkb:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Use a URL-safe POSTGRES_PASSWORD (or percent-encode special characters).
      DATABASE_URL: postgres://memexkb:${POSTGRES_PASSWORD:-changeme}@db:5432/memexkb
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-strong-secret} # Replace for real deployments.
      STATIC_DIR: /app/public
      MIGRATIONS_DIR: /app/migrations
      # ── Cookie / session ────────────────────────────────────────────────────
      # COOKIE_SECURE: Set to "true" only when serving over HTTPS (e.g. behind
      # a TLS-terminating reverse proxy). Leave "false" or remove for plain HTTP
      # deployments such as Docker Desktop direct port-mapping — browsers will
      # silently reject a Secure cookie over http://localhost.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # COOKIE_SAMESITE: "lax" (default) | "strict" | "none".
      # Use "none" only with HTTPS; it automatically enables the Secure flag.
      # COOKIE_SAMESITE: "lax"
      # TRUST_PROXY: Number of trusted reverse-proxy hops. Default is 1.
      # Set to 0 when running without any reverse proxy (direct port-mapping).
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Optional — uncomment to seed an initial admin account on first boot:
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy

  # ── MCP stdio launcher (opt-in) ───────────────────────────────────────────────
  # This is intentionally a profile service: stdio must remain attached to the
  # LLM client's stdin/stdout, so it should be started with `docker compose run`
  # rather than as a detached `docker compose up` service.
  mcp:
    image: ghcr.io/klarge/memexkb:latest
    profiles: ["mcp"]
    stdin_open: true
    tty: false
    command: ["node", "/app/mcp/dist/index.js"]
    environment:
      MEMEX_URL: http://app:3000
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
