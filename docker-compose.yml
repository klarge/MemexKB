services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexikon
      POSTGRES_USER: lexikon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexikon -d lexikon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── DB schema migration ──────────────────────────────────────────────────────
  # Runs once per `docker compose up` and exits.  The app service will not start
  # until this completes successfully.
  #
  # NOTE: both `migrate` and `app` use `build: context: .` which requires the
  # full source tree — including the Dockerfile — to be present on the Docker
  # host.  In Portainer, use the *Repository* stack type (point it at your git
  # repo) rather than the web editor, so Portainer can clone all the files.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: on-failure
    command: >
      sh -c "
        echo 'Waiting for Postgres...' &&
        node -e \"
          const net = require('net');
          (function wait() {
            const s = new net.Socket();
            s.connect(5432, 'db', () => { console.log('Postgres is ready'); s.destroy(); process.exit(0); });
            s.on('error', () => { s.destroy(); setTimeout(wait, 2000); });
          })();
        \" &&
        echo 'Running schema push...' &&
        pnpm --filter @workspace/db run push
      "
    environment:
      # Accept DATABASE_URL directly from the host environment when set;
      # fall back to the compose-managed Postgres service.
      DATABASE_URL: ${DATABASE_URL:-postgres://lexikon:${POSTGRES_PASSWORD:-changeme}@db:5432/lexikon}
    depends_on:
      db:
        condition: service_healthy

  # ── Application ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Accept DATABASE_URL directly from the host environment when set;
      # fall back to the compose-managed Postgres service.
      DATABASE_URL: ${DATABASE_URL:-postgres://lexikon:${POSTGRES_PASSWORD:-changeme}@db:5432/lexikon}
      SESSION_SECRET: ${SESSION_SECRET}
      STATIC_DIR: /app/public
      # Optional — comma-separated list of allowed CORS origins
      # CORS_ORIGIN: https://yourdomain.com
      # Optional — seed an initial admin account on first boot
      # RUN_SEED: "true"
      # SEED_ADMIN_EMAIL: admin@example.com
      # SEED_ADMIN_PASSWORD: changeme123
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
